name: Build Android AAB

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      KOTLIN_VERSION: "2.1.0"
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        
      - name: Show build.gradle
        run: cat android/build.gradle
        
      - name: Fix Kotlin version
        run: |
          python3 << 'PYEOF'
          import re
          with open('android/build.gradle', 'r') as f:
              content = f.read()
          print("Before:", re.findall(r'kotlin[Vv]ersion.*', content))
          content = re.sub(r'kotlinVersion\s*=\s*["\'][\d.]+["\']', 'kotlinVersion = "2.1.0"', content)
          content = re.sub(r'ext\.kotlinVersion\s*=\s*["\'][\d.]+["\']', 'ext.kotlinVersion = "2.1.0"', content)
          with open('android/build.gradle', 'w') as f:
              f.write(content)
          print("After:", re.findall(r'kotlin[Vv]ersion.*', content))
          PYEOF
          
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          
      - name: Find and Upload AAB
        run: find . -name "*.aab" -type f
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: wayy-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
