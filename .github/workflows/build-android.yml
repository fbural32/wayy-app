name: Build Android AAB

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        
      - name: Fix Kotlin version in build.gradle
        run: |
          echo "=== Before fix ==="
          grep -n "kotlin" android/build.gradle || true
          python3 -c "
          content = open('android/build.gradle').read()
          content = content.replace('1.9.25', '2.1.0')
          open('android/build.gradle', 'w').write(content)
          print('Fixed!')
          "
          echo "=== After fix ==="
          grep -n "kotlin" android/build.gradle || true
          
      - name: Build AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
          
      - name: Find AAB
        run: find . -name "*.aab" -type f
          
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: wayy-release
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
