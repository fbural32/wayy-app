workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20.20.2
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Prebuild Android
        script: npx expo prebuild --platform android --clean
      - name: Fix Kotlin version
        script: |
          python3 -c "
          import re
          with open('android/build.gradle', 'r') as f:
              content = f.read()
          content = re.sub(r'kotlinVersion\s*=\s*[\"\']\d+\.\d+\.\d+[\"\']', 'kotlinVersion = \"2.1.0\"', content)
          with open('android/build.gradle', 'w') as f:
              f.write(content)
          print('Kotlin version fixed!')
          "
      - name: Build AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
