workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20.20.2
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Prebuild Android
        script: npx expo prebuild --platform android --clean
      - name: Build AAB
        script: |
          # Fix Kotlin version before build
          sed -i "s/kotlinVersion = \"1.9.25\"/kotlinVersion = \"2.1.0\"/g" android/build.gradle
          sed -i "s/kotlinVersion = '1.9.25'/kotlinVersion = '2.1.0'/g" android/build.gradle
          echo "Kotlin version in build.gradle:"
          grep -n "kotlin" android/build.gradle || echo "not found"
          
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
