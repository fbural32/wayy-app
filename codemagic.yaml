workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 20.20.2
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Prebuild Android
        script: npx expo prebuild --platform android --clean
      - name: Build AAB
        script: |
          # Fix Kotlin version
          python3 -c "
          content = open('android/build.gradle').read()
          print('Current kotlin:', [l for l in content.split('\n') if 'kotlin' in l.lower()])
          content = content.replace('1.9.25', '2.1.0')
          open('android/build.gradle', 'w').write(content)
          content2 = open('android/build.gradle').read()
          print('Fixed kotlin:', [l for l in content2.split('\n') if 'kotlin' in l.lower()])
          "
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
